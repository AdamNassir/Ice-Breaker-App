<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f2ade"><title>AI or Human? · Presenter</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/style.css?v=layout-fix-14"><link rel="stylesheet" href="/static/imagestyle.css?v=layout-fix-14"><script defer src="/static/newsarticle.js?v=article-teams-15"></script><script defer src="/static/media.js?v=reveal-layout-4"></script><script defer src="/static/app.js?v=identity-reveal-16"></script><link rel="stylesheet" href="/static/newsarticle.css?v=article-teams-15"></head>
<body data-role="presenter"><header class="topbar"><a class="brand" href="/"><span class="brand-icon" aria-hidden="true">A?</span>AI or Human<span class="brand-dot">●</span></a><div class="brand-logos" aria-label="LogicLever and TotalEnergies"><img class="logo-logiclever" src="/static/branding/logiclever-full.jpg" alt="LogicLever" width="1024" height="385"><img class="logo-totalenergies" src="/static/branding/totalenergies.png" alt="TotalEnergies" width="400" height="225"></div><span class="top-label">PRESENTER CONSOLE</span><a class="text-link" href="/">Player view</a></header><main class="page presenter-page">
  <section id="entry" class="entry-grid"><div class="intro brand-intro" aria-label="LogicLever and TotalEnergies"><div class="brand-logos brand-logos-hero"><img class="logo-logiclever" src="/static/branding/logiclever-full.jpg" alt="LogicLever" width="1024" height="385"><img class="logo-totalenergies" src="/static/branding/totalenergies.png" alt="TotalEnergies" width="400" height="225"></div></div><section class="entry-card"><div class="card-topline"><span class="eyebrow">HOST A GAME</span><span class="step-mark">01</span></div><h2>Ready for a little doubt?</h2><form id="create-form"><label for="game-title">Game title</label><input id="game-title" name="title" value="AI or Human" maxlength="60" required><div class="duration-label"><label for="seconds">Seconds per round</label><output id="seconds-output">25 sec</output></div><input type="range" id="seconds" name="seconds" min="5" max="120" step="5" value="25"><label for="password">Presenter password</label><input type="password" id="password" name="password" autocomplete="current-password" placeholder="Optional for local play"><button class="primary wide" id="create-button">Create room</button></form><p class="small">Share the player link, then start when everyone is ready.</p></section></section>
  <section id="game" hidden><div class="game-heading" hidden><div><span class="eyebrow" id="phase-label">IN THE LOBBY</span><h1 class="room-title" id="room-title">AI or Human</h1></div></div><div id="round-progress" class="round-progress" hidden aria-label="Round progress"></div><div class="presenter-grid"><section class="game-card"><div class="round-toolbar" hidden><span id="round-label">Waiting for players</span><div class="toolbar-right"><span id="answered-count" class="small"></span><div id="clock-wrap" class="clock" hidden><span id="clock">25</span><span class="clock-unit">sec</span></div></div></div><div class="timer-track" id="timer-track" hidden><div id="timer-fill"></div></div><section id="qr-lobby" class="qr-lobby" aria-label="Join this room"><canvas id="join-qr" class="join-qr" role="img" aria-label="QR code opening this room’s player join page" width="460" height="460" hidden></canvas><p id="qr-status" class="small" aria-live="polite">Creating QR code…</p><button id="retry-qr" class="secondary" type="button" hidden>Retry QR code</button><strong id="share-code" class="lobby-code"></strong><p id="room-meta" class="small"></p><button id="copy-link" class="secondary">Copy player link</button></section><div id="stage" class="stage" hidden></div><div id="reveal" class="reveal" hidden aria-live="polite"></div><div class="host-controls"><button class="primary" id="control-button">Start round 1</button><span id="control-help" class="small"></span></div></section></div></section><div id="notice" class="notice" role="status" hidden></div><p id="connection" class="connection" aria-live="polite"></p>
</main><footer><span>AI or Human · Presenter controls</span><button id="leave" class="text-link" hidden>New game</button></footer></body></html>
